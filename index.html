<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Crash Camp — Sub-Zero Wilderness Survival</title>
    <meta name="description" content="Survive the sub-zero aftermath of Flight 402 with authentic 3D graphics, procedural biomes, and 100% offline play." />
    <meta name="theme-color" content="#171918" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crash Camp" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-card">
        <div class="loading-title">CRASH CAMP</div>
        <div class="loading-subtitle">ACT I — THE CRASH</div>
        <div class="loading-bar-wrap">
          <div id="loading-bar" class="loading-bar" style="width: 15%;"></div>
        </div>
        <div id="loading-status" class="loading-status">Loading survivor assets...</div>
      </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- Reticle & Interaction Prompt -->
    <div id="reticle">
      <div class="reticle-dot"></div>
      <div id="interaction-prompt" class="interaction-prompt hidden"></div>
    </div>

    <!-- Scene Navigation UI Panel -->
    <div id="scene-nav-panel"></div>

    <!-- Floating Feedback Toast Container -->
    <div id="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
